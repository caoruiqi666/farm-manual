<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5f2a">
<title>智慧农场操作手册</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#f0f4f0;color:#333;line-height:1.6}
.header{background:linear-gradient(135deg,#1a5f2a,#2e7d32);color:#fff;padding:15px;text-align:center;position:sticky;top:0;z-index:100}
.header h1{margin:0;font-size:20px}
.content{padding:15px;max-width:480px;margin:0 auto;padding-bottom:100px}
.card{background:#fff;border-radius:12px;padding:15px;margin-bottom:12px;box-shadow:0 2px 8px rgba(0,0,0,0.08)}
.card-title{font-size:16px;font-weight:700;margin-bottom:8px;color:#1a5f2a}
.card-body{font-size:14px;color:#666}
.btn{background:#1a5f2a;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;margin-right:8px;margin-top:8px}
.btn-secondary{background:#f0f0f0;color:#333}
.btn-danger{background:#c62828;color:#fff}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.nav-item{text-align:center;cursor:pointer;color:#999;font-size:12px;flex:1}
.nav-item.active{color:#1a5f2a}
.nav-icon{font-size:22px;display:block;margin-bottom:2px}
.tag{display:inline-block;background:#e8f5e9;color:#1a5f2a;font-size:11px;padding:3px 10px;border-radius:15px;margin:3px;cursor:pointer}
.highlight{background:#fff3cd;padding:2px 6px;border-radius:4px;color:#856404;font-size:13px}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.todo-check{width:22px;height:22px;border:2px solid #1a5f2a;border-radius:50%;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px}
.todo-check.done{background:#1a5f2a;color:#fff}
.todo-text{flex:1;font-size:14px}
.todo-text.done{text-decoration:line-through;color:#999}
.textarea{width:100%;min-height:150px;border:1px solid #ddd;border-radius:8px;padding:10px;font-size:14px;resize:none;font-family:inherit}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;align-items:flex-end}
.modal.show{display:flex}
.modal-content{background:#fff;width:100%;max-width:480px;border-radius:20px 20px 0 0;padding:20px;max-height:80vh;overflow-y:auto;margin:0 auto}
.preview{background:#f8f8f8;border-radius:8px;padding:10px;margin:10px 0;font-size:13px;max-height:200px;overflow-y:auto}
.empty{text-align:center;padding:40px;color:#999}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:300;display:none;white-space:nowrap}
.entry-item{padding:10px 0;border-bottom:1px solid #f0f0f0}
.entry-q{font-weight:600;color:#1a5f2a;font-size:14px;margin-bottom:4px}
.entry-a{font-size:13px;color:#555;white-space:pre-wrap}
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.search-box{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;margin-bottom:12px}
.add-todo-box{display:flex;gap:8px;margin-bottom:12px}
.add-todo-box input{flex:1;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}
</style>
</head>
<body>
<div class="header"><h1>🌱 智慧农场操作手册</h1></div>
<div class="content" id="content"></div>

<div class="nav" id="nav">
  <div class="nav-item active" data-page="home" onclick="showPage('home')">
    <span class="nav-icon">🏠</span>首页
  </div>
  <div class="nav-item" data-page="knowledge" onclick="showPage('knowledge')">
    <span class="nav-icon">📚</span>知识
  </div>
  <div class="nav-item" data-page="paste" onclick="showPage('paste')">
    <span class="nav-icon">➕</span>粘贴
  </div>
  <div class="nav-item" data-page="todo" onclick="showPage('todo')">
    <span class="nav-icon">✅</span>待办
  </div>
  <div class="nav-item" data-page="settings" onclick="showPage('settings')">
    <span class="nav-icon">⚙️</span>设置
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal" id="modal">
  <div class="modal-content">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px">
      <h3 style="margin:0">📋 粘贴聊天记录</h3>
      <span style="font-size:24px;cursor:pointer" onclick="closeModal()">✕</span>
    </div>
    <p style="font-size:13px;color:#666">💡 把和AI的聊天记录复制粘贴到这里，会自动提取问答对</p >
    <textarea class="textarea" id="inputArea" placeholder="复制完整聊天记录，粘贴到这里..."></textarea>
    <div class="preview" id="preview" style="display:none"></div>
    <div style="margin-top:10px">
      <button class="btn" onclick="parseText()">🔍 智能解析</button>
      <button class="btn" id="saveBtn" style="display:none;background:#2e7d32" onclick="saveData()">💾 保存</button>
      <button class="btn btn-secondary" onclick="closeModal()">取消</button>
    </div>
  </div>
</div>

<script>
// ========== 数据存储 ==========
var memoryData = {entries: [], todos: []};
var STORAGE_KEY = 'farm_manual_data_v1';

function loadData() {
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      var parsed = JSON.parse(raw);
      if (parsed && parsed.entries) memoryData.entries = parsed.entries;
      if (parsed && parsed.todos) memoryData.todos = parsed.todos;
    }
  } catch(e) {
    console.log('加载数据失败', e);
  }
}

function saveToStorage() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(memoryData));
  } catch(e) {
    showToast('保存失败，存储空间可能已满');
  }
}

  plant: {name: '🌱 植物种植区', keywords: ['生菜','小葱','薄荷','草莓','番茄','香菜','菠菜','芹菜','徒长','补光','LED','光照','光谱','PPFD','色温','氮','磷','钾','NPK','液肥','施肥','水培','土培','基质']},
  device: {name: '🔧 设备工坊', keywords: ['灯','LED','ESP','传感器','水泵','加热','帆布池','插座','WiFi','蓝牙','量子板','COB','定时','功率','电压','继电器','单片机','Arduino','树莓派']},
  nutrient: {name: '🧂 营养调配台', keywords: ['草木灰','烟灰','蛋壳','钙肥','氮肥','钾肥','磷肥','过磷酸钙','硫酸钾','尿素','豆水','液肥','堆肥','发酵','粪肥','有机肥','营养液']},
  env: {name: '❄️ 环境控制室', keywords: ['冬季','大棚','温室','供暖','保温','发酵','堆肥','化粪池','沼气','温度','湿度','莫斯科','明斯克','俄罗斯','白俄罗斯','气候','通风']},
  business: {name: '💰 商业计划书', keywords: ['成本','盈利','销售','跨境','物流','受众','市场','价格','500元','预算','投资','收入','客户','利润','营销']}
};

var currentPage = 'home';
var currentFilter = 'all';
var tempParsed = null;

// ========== 工具函数 ==========
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(function() { t.style.display = 'none'; }, 2000);
}
