<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧农场操作手册</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f0f4f0}
.header{background:#1a5f2a;color:#fff;padding:15px;text-align:center}
.content{padding:20px;max-width:480px;margin:0 auto}
.card{background:#fff;border-radius:10px;padding:15px;margin-bottom:10px;box-shadow:0 2px 5px rgba(0,0,0,0.1)}
.btn{background:#1a5f2a;color:#fff;border:none;padding:10px 20px;border-radius:5px;cursor:pointer;font-size:14px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:10px}
.nav-item{text-align:center;cursor:pointer}
</style>
</head>
<body>
<div class="header">
  <h1>🌱 智慧农场操作手册</h1>
</div>
<div class="content" id="content">
  <div class="card">
    <h3>📊 仪表盘</h3>
    <p>待办事项: <span id="todoCount">0</span></p >
    <p>知识条目: <span id="entryCount">0</span></p >
  </div>
  <div class="card">
    <h3>⚡ 快捷操作</h3>
    <button class="btn" onclick="addTest()">添加测试数据</button>
    <button class="btn" onclick="showAlert()">测试弹窗</button>
  </div>
  <div class="card">
    <h3>📋 粘贴记录</h3>
    <textarea id="inputArea" style="width:100%;height:100px;margin-bottom:10px" placeholder="粘贴聊天记录..."></textarea>
    <button class="btn" onclick="parseText()">解析</button>
    <div id="result" style="margin-top:10px"></div>
  </div>
</div>
<div class="nav">
  <div class="nav-item" onclick="showPage('home')">🏠<br>首页</div>
  <div class="nav-item" onclick="showPage('knowledge')">📚<br>知识</div>
  <div class="nav-item" onclick="showPage('paste')">➕<br>粘贴</div>
  <div class="nav-item" onclick="showPage('todo')">✅<br>待办</div>
  <div class="nav-item" onclick="showPage('settings')">⚙️<br>设置</div>
</div>

<script>
var data = {entries: [], todos: []};

function showAlert() {
  alert('JavaScript运行正常！');
}

function addTest() {
  data.entries.push({id: Date.now(), text: '测试条目'});
  data.todos.push({id: Date.now(), text: '测试待办', done: false});
  updateCount();
  alert('已添加测试数据！');
}

function updateCount() {
  document.getElementById('todoCount').textContent = data.todos.filter(function(t){return !t.done}).length;
  document.getElementById('entryCount').textContent = data.entries.length;
}

function parseText() {
  var text = document.getElementById('inputArea').value;
  var result = document.getElementById('result');
  if(!text) {
    result.innerHTML = '<p style="color:red">请先输入内容</p >';
    return;
  }

  var lines = text.split('
').filter(function(l){return l.trim()});
  var todos = [];
  lines.forEach(function(line) {
    if(line.match(/^\s*[\[【]/)) {
      todos.push(line.replace(/^\s*[\[【]\s*[\]】]\s*/, ''));
    }
  });

  result.innerHTML = '<p>识别到 ' + lines.length + ' 行</p >' + 
    '<p>待办: ' + todos.length + ' 条</p >' +
    '<button class="btn" onclick="saveData()">保存</button>';

  window.tempData = {raw: text, todos: todos};
}

function saveData() {
  if(window.tempData) {
    data.entries.push(window.tempData);
    window.tempData.todos.forEach(function(t) {
      data.todos.push({text: t, done: false});
    });
    updateCount();
    alert('保存成功！');
    document.getElementById('inputArea').value = '';
    document.getElementById('result').innerHTML = '';
  }
}

function showPage(page) {
  alert('切换到: ' + page);
}

updateCount();
</script>
</body>
</html>
