<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a5f2a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="农场手册">
<meta name="mobile-web-app-capable" content="yes">
<title>智慧农场操作手册</title>
<style>
:root{--primary:#1a5f2a;--primary-light:#2e7d32;--bg:#f0f4f0;--card:#fff;--text:#333;--text2:#666;--border:#ddd;--radius:12px;--shadow:0 2px 8px rgba(0,0,0,0.08);--danger:#c0392b;--warning:#f39c12;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overscroll-behavior-y:none}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative}
.warning-bar{background:var(--warning);color:#fff;padding:10px 16px;font-size:13px;text-align:center;display:none}
.warning-bar.show{display:block}
.header{background:linear-gradient(135deg,var(--primary),var(--primary-light));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100;box-shadow:0 2px 10px rgba(26,95,42,0.3)}
.header h1{margin:0;font-size:18px;display:flex;align-items:center;gap:8px}
.header-icon{width:28px;height:28px;background:rgba(255,255,255,0.2);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.content{flex:1;padding:12px 16px 80px;overflow-y:auto}
.section-title{font-size:14px;font-weight:700;color:var(--primary);margin:16px 0 8px;text-transform:uppercase;letter-spacing:1px}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card-title{font-size:15px;font-weight:700;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.card-body{font-size:13px;color:var(--text2);line-height:1.7}
.card-tag{display:inline-block;background:var(--bg);color:var(--primary);font-size:11px;padding:2px 8px;border-radius:20px;margin-right:4px;margin-top:4px;border:1px solid var(--border)}
.todo-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid #f0f0f0}
.todo-item:last-child{border-bottom:none}
.todo-check{width:22px;height:22px;border:2px solid var(--primary);border-radius:50%;flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.todo-check.done{background:var(--primary);color:#fff;border-color:var(--primary)}
.todo-text{flex:1;font-size:14px}
.todo-text.done{text-decoration:line-through;color:#999}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.grid-item{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);cursor:pointer;transition:transform .15s;border:2px solid transparent}
.grid-item:active{transform:scale(0.96)}
.grid-item.active{border-color:var(--primary)}
.grid-icon{font-size:28px;margin-bottom:6px}
.grid-label{font-size:13px;font-weight:600}
.grid-count{font-size:11px;color:#999;margin-top:2px}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:flex;justify-content:space-around;padding:6px 0;z-index:100;max-width:480px;margin:0 auto;left:50%;transform:translateX(-50%)}
.nav-item{flex:1;text-align:center;padding:4px 0;cursor:pointer;color:#999;transition:color .2s}
.nav-item.active{color:var(--primary)}
.nav-icon{font-size:22px;display:block;margin-bottom:2px}
.nav-label{font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:200;display:none;align-items:flex-end;justify-content:center}
.modal.show{display:flex}
.modal-content{background:#fff;width:100%;max-width:480px;max-height:85vh;border-radius:20px 20px 0 0;padding:16px;display:flex;flex-direction:column;animation:slideUp .3s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.modal-title{font-size:16px;font-weight:700}
.modal-close{font-size:24px;color:#999;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.textarea{width:100%;min-height:200px;border:1px solid var(--border);border-radius:8px;padding:10px;font-size:14px;resize:none;font-family:inherit}
.btn-primary{background:var(--primary);color:#fff;border:none;padding:12px;border-radius:8px;font-size:15px;font-weight:600;width:100%;margin-top:10px;cursor:pointer;position:relative}
.btn-primary:disabled{opacity:0.6}
.btn-secondary{background:#f0f0f0;color:#333;border:none;padding:10px;border-radius:8px;font-size:14px;width:100%;margin-top:8px;cursor:pointer}
.preview-box{background:#f8f8f8;border-radius:8px;padding:10px;margin-top:10px;font-size:12px;max-height:150px;overflow-y:auto;border:1px solid var(--border)}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0}
.setting-label{font-size:14px}
.empty{text-align:center;padding:40px 20px;color:#999}
.empty-icon{font-size:48px;margin-bottom:10px}
.highlight{background:#fff3cd;padding:1px 4px;border-radius:3px;color:#856404;font-weight:600}
.data-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.data-table th{background:var(--bg);padding:6px;text-align:left;font-weight:600;border-bottom:2px solid var(--border)}
.data-table td{padding:6px;border-bottom:1px solid #f0f0f0}
.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-100px);background:#333;color:#fff;padding:12px 20px;border-radius:8px;font-size:14px;z-index:300;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--primary-light)}
.toast.error{background:var(--danger)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#ccc;border-radius:4px}
.install-tip{background:#e8f5e9;border:1px solid #c8e6c9;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;display:none}
.install-tip.show{display:block}
.install-btn{background:var(--primary);color:#fff;border:none;padding:6px 12px;border-radius:6px;font-size:12px;margin-left:8px;cursor:pointer}
.backup-tip{background:#e3f2fd;border:1px solid #90caf9;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px}
.debug-info{background:#ffebee;border:1px solid #ef9a9a;border-radius:8px;padding:10px;margin:10px 0;font-size:12px;color:#c62828;display:none}
</style>
</head>
<body>
